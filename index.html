<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Aaron Carter Arcade - games and movies in one place.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Aaron Carter's Arcade</title>
  <style>
    @font-face {
      font-family: "Quicksand Bold";
      src: url("Quicksand_Bold.otf") format("opentype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    *, *::before, *::after {
      font-family: "Quicksand Bold", Quicksand, sans-serif !important;
    }
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #f5f5f5;
      --muted: #929292;
      --line: rgba(255,255,255,.15);
      --accent: #e50914;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* Every visible element gently follows the pointer. */
    body * {
      --cursor-x: 0px;
      --cursor-y: 0px;
      transition: translate 180ms cubic-bezier(.2,.7,.2,1);
      will-change: translate;
    }
    .brand img {
      --cursor-x: 0px;
      --cursor-y: 0px;
    }
    .announcement-bar {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      background: #000;
      color: #fff;
      border-bottom: 1px solid #242424;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .announcement-track {
      display: flex;
      flex: 0 0 max-content;
      align-items: center;
      min-width: max-content;
      animation: announcement-marquee 22s linear infinite;
      will-change: transform;
    }
    .announcement-item { display: inline-block; padding: 0 34px; }
    @keyframes announcement-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .announcement-track { animation-duration: 36s; }
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #000;
      color: #fff;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .loading-screen.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-logo { display: block; width: min(78vw, 390px); max-height: 150px; object-fit: contain; }
    .loading-message { color: #fff; font-size: 13px; letter-spacing: .04em; text-align: center; padding: 0 20px; }
    .loading-track { width: min(230px, 55vw); height: 2px; overflow: hidden; background: #222; }
    .loading-track span { display: block; width: 40%; height: 100%; background: #fff; animation: loadingSweep 1s ease-in-out infinite; }
    @keyframes loadingSweep { from { transform: translateX(-110%); } to { transform: translateX(360%); } }
    .site-header {
      position: relative;
      z-index: 5;
      height: 126px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 64px);
      border-bottom: 0;
      background: #000;
      animation: headerIn .8s ease both;
    }
    .brand {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }
    .brand img {
      display: block;
      width: clamp(230px, 34vw, 390px);
      max-height: 112px;
      object-fit: contain;
      transform-origin: center;
      animation: logoEnter 1.1s cubic-bezier(.2,.8,.2,1) both, logoFloat 5s ease-in-out 1.1s infinite;
      transition: transform .35s ease, filter .35s ease;
      filter: drop-shadow(0 0 0 rgba(255,255,255,0));
    }
    .brand:hover img {
      transform: scale(1.06);
      filter: drop-shadow(0 0 13px rgba(255,255,255,.22));
    }
    .header-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(229,9,20,.6);
      animation: dotPulse 2.2s ease-in-out infinite;
    }
    main {
      min-height: calc(100vh - 126px);
      padding: 28px clamp(20px, 4vw, 64px) 36px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    .hero {
      width: min(100%, 900px);
      margin: 0 auto 68px;
      text-align: center;
      animation: heroIn 1s .15s ease both;
    }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 20px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: clamp(25px, 3vw, 35px);
      letter-spacing: -.04em;
      font-weight: 750;
    }
    .section-heading p {
      margin: 7px 0 0;
      color: #fff;
      font-size: 13px;
      line-height: 1.6;
    }
    .section-kicker {
      color: #fff;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .categories {
      width: min(100%, 1240px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      animation: heroIn .9s .3s ease both;
    }
    .category-card {
      position: relative;
      min-height: 235px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(22px, 3vw, 32px);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.018) 65%);
      box-shadow: inset 0 1px rgba(255,255,255,.035);
      transition: border-color .25s ease, background .25s ease, transform .25s ease;
    }
    .category-card::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -55px;
      top: -75px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.12), transparent 68%);
      pointer-events: none;
      transition: transform .45s ease, opacity .45s ease;
    }
    .category-card:hover {
      border-color: rgba(255,255,255,.32);
      background: linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.025) 65%);
      transform: translateY(-3px);
    }
    .category-card:hover::before { transform: scale(1.2); opacity: 1.4; }
    .category-top, .category-bottom { position: relative; z-index: 1; }
    .category-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      color: #fff;
      margin-bottom: 27px;
    }
    .category-icon svg { width: 23px; height: 23px; }
    .category-card h3 {
      margin: 0;
      font-size: clamp(24px, 3vw, 32px);
      letter-spacing: -.05em;
      font-weight: 600;
    }
    .category-card p {
      margin: 9px 0 0;
      color: #fff;
      font-size: 13px;
      line-height: 1.65;
      max-width: 320px;
    }
    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 10px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .coming-soon::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #bbb;
      box-shadow: 0 0 10px rgba(255,255,255,.35);
    }
    .sections-layout {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: clamp(22px, 3vw, 36px);
    }
    .content-section {
      width: 100%;
      min-width: 0;
      margin: 0 0 48px;
      animation: heroIn .8s ease both;
    }
    .movies-section { animation-delay: .12s; }
    @media (max-width: 760px) { .sections-layout { grid-template-columns: minmax(0, 1fr); gap: 22px; } }
    /* Horizontal streaming rows: scroll or swipe left and right. */
    .content-grid {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 14px 2px 18px;
      border-top: 1px solid var(--line);
      scroll-snap-type: x proximity;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #555 #111;
    }
    .content-grid::-webkit-scrollbar { height: 8px; }
    .content-grid::-webkit-scrollbar-track { background: #111; }
    .content-grid::-webkit-scrollbar-thumb { background: #555; border-radius: 8px; }
    .content-tile {
      flex: 0 0 clamp(340px, 42vw, 480px);
      min-width: 0;
      scroll-snap-align: start;
      border: 0;
      border-radius: 0;
      background: transparent;
      transition: opacity .2s ease;
    }
    .content-tile:hover { opacity: .86; }
    .tile-link {
      appearance: none;
      border: 0;
      margin: 0;
      width: 100%;
      color: inherit;
      text-align: left;
      font: inherit;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      min-height: 0;
      height: 100%;
      padding: 0 0 8px;
    }
    .tile-art {
      flex: 0 0 auto;
      width: 42%;
      flex: 0 0 42%;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .tile-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile-info { min-width: 0; flex: 1; padding: 4px 0; }
    @media (max-width: 520px) {
      .content-tile { flex-basis: min(88vw, 390px); }
      .tile-link { gap: 12px; }
      .tile-art { width: 40%; flex-basis: 40%; }
      .tile-info h3 { font-size: 14px; }
      .tile-info p { font-size: 11px; }
    }
    .tile-info h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
    .tile-info p { margin: 6px 0 0; color: #fff; font-size: 12px; line-height: 1.55; }
    .empty-tile {
      padding: 23px 10px;
      border-bottom: 1px solid var(--line);
      color: #fff;
    }
    .empty-tile h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .empty-tile p { margin: 7px 0 0; color: #fff; font-size: 12px; line-height: 1.6; }
    .tile-tag { display: inline-block; margin-top: 9px; color: #fff; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
    .more-soon {
      width: min(100%, 1050px);
      margin: 27px auto 0;
      text-align: center;
      color: #fff;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: #555;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 96px);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 650;
    }
    h1 span {
      color: #fff;
      font-weight: 450;
    }
    .intro {
      max-width: 470px;
      margin: 26px auto 0;
      color: #fff;
      font-size: clamp(14px, 1.6vw, 16px);
      line-height: 1.8;
    }
    .bottom-line {
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      margin: 38px clamp(22px, 6vw, 88px) 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .bottom-line .rule {
      width: clamp(35px, 12vw, 130px);
      height: 1px;
      background: linear-gradient(90deg, #777, transparent);
    }
    @keyframes headerIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes logoEnter {
      0% { opacity: 0; transform: scale(.72); filter: blur(7px); }
      70% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes logoFloat {
      0%, 100% { translate: var(--cursor-x, 0px) var(--cursor-y, 0px); }
      50% { translate: var(--cursor-x, 0px) calc(var(--cursor-y, 0px) - 4px); }
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: .45; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes ambient {
      from { transform: scale(.88); opacity: .5; }
      to { transform: scale(1.08); opacity: 1; }
    }
    @media (max-width: 680px) {
      .site-header { height: 112px; padding: 0 20px; }
      .brand img { width: clamp(210px, 58vw, 300px); max-height: 96px; }
      .header-mark { font-size: 9px; letter-spacing: .1em; gap: 7px; }
      main { min-height: calc(100vh - 112px); padding: 30px 20px 20px; }
      .hero { margin-bottom: 48px; }
      .tile-link { gap: 12px; padding: 11px 4px; }
      .tile-art { flex-basis: 96px; width: 96px; }
      .tile-info h3 { font-size: 15px; }
      .content-section { margin-bottom: 44px; }
      .section-heading { align-items: start; flex-direction: column; gap: 8px; }
      .bottom-line { margin: 32px 20px 22px; font-size: 8px; letter-spacing: .1em; }
    }
    /* Custom pixel cursor: both images use the same fixed-size box. */
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 99999;
      opacity: 0;
      transform: translate(-2px, -2px);
      transition: opacity .12s ease;
      will-change: left, top;
    }
    .custom-cursor img {
      position: absolute;
      inset: 0;
      display: block;
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .custom-cursor .cursor-hand { display: none; }
    .custom-cursor.is-hovering .cursor-arrow { display: none; }
    .custom-cursor.is-hovering .cursor-hand { display: block; }
    .custom-cursor.is-visible { opacity: 1; }
    @media (pointer: fine) {
      body.custom-cursor-active, body.custom-cursor-active a, body.custom-cursor-active button,
      body.custom-cursor-active [role="button"], body.custom-cursor-active input,
      body.custom-cursor-active select, body.custom-cursor-active summary { cursor: none !important; }
    }
    @media (pointer: coarse) {
      .custom-cursor { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        will-change: auto !important;
      }
    }

    .announcement-track { width: max-content; animation-duration: 75s; }
    .announcement-bar:hover .announcement-track { animation-play-state: paused; }
    .install-banner {
      display: none; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap; padding: 12px 18px; background: #101010;
      border-bottom: 1px solid #303030; color: #fff; font-size: 13px; text-align: center;
    }
    .install-banner.is-visible { display: flex; }
    .install-banner button {
      border: 1px solid #fff; border-radius: 5px; background: #fff; color: #000;
      padding: 8px 14px; font-weight: 700; cursor: pointer; font: inherit;
    }
    .install-banner .install-dismiss { background: transparent; color: #fff; }
  </style>
</head>
<body>

    <div class="announcement-track" id="announcementTrack"></div>
  </div>
  <aside class="install-banner" id="installBanner" aria-live="polite">
    <span id="installMessage">Install Aaron Carter’s Arcade for quick access!</span>
    <button id="installButton" type="button">Install App</button>
    <button id="installDismiss" class="install-dismiss" type="button" aria-label="Dismiss install message">Not now</button>
  </aside>

  <script>
    (() => {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const finePointer = window.matchMedia('(pointer: fine)').matches;
      if (reduceMotion || !finePointer) return;

      const elements = [...document.body.querySelectorAll('*')]
        .filter(el => !['SCRIPT', 'STYLE'].includes(el.tagName));
      let frame = 0;
      let pointerX = innerWidth / 2;
      let pointerY = innerHeight / 2;

      function moveElements() {
        frame = 0;
        const nx = (pointerX / Math.max(innerWidth, 1) - 0.5) * 2;
        const ny = (pointerY / Math.max(innerHeight, 1) - 0.5) * 2;
        elements.forEach((el, index) => {
          const rect = el.getBoundingClientRect();
          if (!rect.width && !rect.height) return;
          // Small, varied movement gives each element its own subtle depth.
          const depth = 1.1 + (index % 5) * 0.42;
          const localX = ((pointerX - (rect.left + rect.width / 2)) / Math.max(innerWidth, 1));
          const localY = ((pointerY - (rect.top + rect.height / 2)) / Math.max(innerHeight, 1));
          const x = Math.max(-3.5, Math.min(3.5, nx * depth - localX * 1.4));
          const y = Math.max(-3.5, Math.min(3.5, ny * depth - localY * 1.4));
          el.style.setProperty('--cursor-x', x.toFixed(2) + 'px');
          el.style.setProperty('--cursor-y', y.toFixed(2) + 'px');
          if (el !== document.querySelector('.brand img')) {
            el.style.translate = `var(--cursor-x) var(--cursor-y)`;
          }
        });
      }

      window.addEventListener('pointermove', event => {
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (!frame) frame = requestAnimationFrame(moveElements);
      }, { passive: true });
      window.addEventListener('pointerleave', () => {
        elements.forEach(el => {
          el.style.setProperty('--cursor-x', '0px');
          el.style.setProperty('--cursor-y', '0px');
          if (el !== document.querySelector('.brand img')) el.style.translate = '0px 0px';
        });
      });
    })();

    // Add/remove items in either message list whenever you want.
    // ================================================================
    const SITE_CONFIG = {
      siteName: "Aaron Carter's Arcade",
      loadingMessages: [
        "loading the loading",
        "also try getaway shootout ig",
        "this finna be peak",
        "gogurdian got nothing on this",
        "ayyyyyyyyyy",
        "classroom, 123movies COMBINED TOGETHER",
        "hi"
      ],
      announcementMessages: [
        "welcome to aaron carter arcade, presented by proxy's university!"
      ],
      installMessage: "install Aaron Carter's Arcade to access it easier!",
      installButtonText: "Install App",
      installDismissText: "Maybe next time...?",
      emptyGameMessage: "no games yet",
      emptyMovieMessage: "no movies yet",
      popupBlockedMessage: "Please allow pop-ups for this site, then click again.",
      missingGameLinkMessage: "aint no game for this yet, WAIT!",
      missingMovieLinkMessage: "no movie yet, WAIT BRO!"
    };

    // Build the seamless marquee from SITE_CONFIG. It duplicates the list once
    // so the animation can loop continuously without a gap.
    (() => {
      const track = document.getElementById('announcementTrack');
      const messages = SITE_CONFIG.announcementMessages;
      track.innerHTML = [...messages, ...messages].map((message, index) =>
        `<span class="announcement-item"${index >= messages.length ? ' aria-hidden="true"' : ''}>${escapeHTML(message)}</span>`
      ).join('');
    })();

    // EDIT THESE LISTS. There are 20 ready-to-fill slots in each section.
    // Fill in a slot's fields and change hide: true to hide: false to show it.
    // Games: name, image, link (destination opened in an about:blank player page), file, description, hide.
    const games = [
      { name: "Getaway Shootout", image: "https://www.drifted.com/wp-content/uploads/2023/05/getaway-shootout-570-featured_16_9.jpg", link: "https://bro-two.vercel.app/", file: "", description: "Getaway Shootout is a chaotic, physics-based online and local multiplayer racing and parkour game developed by New Eich Games and released in August 2018.", hide: false }, // Game slot 01
      { name: "Basket Random", image: "https://imgs.crazygames.com/basket-random_16x9/20240617090207/basket-random_16x9-cover?metadata=none&quality=100&width=1200&height=630&fit=crop", link: "https://proxysuniversity.github.io/games/basket-random.html", file: "", description: "Basket Random is a chaotic, 2-player arcade sports video game developed by RHM Interactive and published by Playgama.", hide: false }, // Game slot 02
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 03
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 04
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 05
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 06
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 07
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 08
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 09
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 10
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 11
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 12
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 13
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 14
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 15
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 16
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 17
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 18
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 19
      { name: "", image: "", link: "", file: "", description: "", hide: true }, // Game slot 20
    ];

    // Movies: title, image, googleDriveVideo (Google Drive video URL), link (fallback), description, hide.
    const movies = [
      { title: "Spider-man: Far From Home", image: "https://images6.alphacoders.com/132/thumb-1920-1322338.jpg", googleDriveVideo: "https://drive.google.com/file/d/1t131YY2YExvKcnwJwFx3XDDNe-XHvrJA/view?usp=sharing", link: "", description: "Peter Parker's relaxing European vacation takes an unexpected turn when Nick Fury shows up in his hotel room to recruit him for a mission. The world is in danger as four massive elemental creatures -- each representing Earth, air, water and fire -- emerge from a hole torn in the universe. Parker soon finds himself donning the Spider-Man suit to help Fury and fellow superhero Mysterio stop the evil entities from wreaking havoc across the continent.", hide: false }, // Movie slot 01
      { title: "Beyond the Stars (Demo)", image: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=640&q=80", googleDriveVideo: "", link: "", description: "A second sample movie template. Replace its title, image, link, and description with your own movie.", hide: true }, // Movie slot 02
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 03
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 04
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 05
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 06
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 07
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 08
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 09
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 10
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 11
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 12
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 13
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 14
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 15
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 16
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 17
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 18
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 19
      { title: "", image: "", googleDriveVideo: "", link: "", description: "", hide: true }, // Movie slot 20
    ];

    function openInBlankPage(url, title, mode) {
      if (!url || !/^https?:\/\//i.test(url)) {
        alert(mode === 'movies' ? SITE_CONFIG.missingMovieLinkMessage : SITE_CONFIG.missingGameLinkMessage);
        return;
      }
      // Open synchronously during the click so browsers do not block the new tab.
      const popup = window.open('about:blank', '_blank');
      if (!popup) {
        alert(SITE_CONFIG.popupBlockedMessage);
        return;
      }
      // Google Drive file-view URLs work better in the embedded player as /preview URLs.
      const driveMatch = String(url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9_-]+)/);
      if (driveMatch) url = `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      const safeTitle = String(title || (mode === 'games' ? 'Game' : 'Movie'))
        .replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const safeUrl = String(url).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      popup.document.open();
      popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aaron Carter's Arcade | ${safeTitle}</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#000}.fallback{padding:20px;color:#fff}a{color:#fff}</style></head><body><iframe src="${safeUrl}" title="${safeTitle}" allow="autoplay; fullscreen; gamepad; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe><noscript><p class="fallback"><a href="${safeUrl}">Open ${safeTitle}</a></p></noscript></body></html>`);
      popup.document.close();
      popup.focus();
    }

    function renderContent(items, gridId, type) {
      const grid = document.getElementById(gridId);
      const visible = items.filter(item => !item.hide && (item.name || item.title || item.image || item.link || item.file || item.googleDriveVideo || item.description));
      if (!visible.length) {
        grid.innerHTML = "";
        return;
      }
      grid.innerHTML = visible.map((item, index) => {
        const title = item.name || item.title || (type === 'games' ? 'Untitled game' : 'Untitled movie');
        const destination = type === 'movies'
          ? (item.googleDriveVideo || item.link || '')
          : (item.link || item.file || '');
        const description = item.description || '';
        const art = item.image ? `<img src="${escapeHTML(item.image)}" alt="${escapeHTML(title)}" loading="lazy">` : `<span>${type === 'games' ? 'GAME' : 'MOVIE'}</span>`;
        const row = `<div class="tile-art">${art}</div><div class="tile-info"><h3>${escapeHTML(title)}</h3>${description ? `<p>${escapeHTML(description)}</p>` : ''}</div>`;
        return `<article class="content-tile"><button type="button" class="tile-link" data-open-mode="${type}" data-open-index="${index}" aria-label="Open ${escapeHTML(title)}">${row}</button></article>`;
      }).join('');
      grid.querySelectorAll('.tile-link[data-open-mode]').forEach((button, index) => {
        button.addEventListener('click', () => {
          const item = visible[index];
          const url = type === 'movies' ? (item.googleDriveVideo || item.link || '') : (item.link || item.file || '');
          openInBlankPage(url, item.name || item.title, type);
        });
      });
    }
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    renderContent(games, 'games-grid', 'games');
    renderContent(movies, 'movies-grid', 'movies');

    // Pick one loading message each time the page opens, then reveal the page.
    (() => {
      const messages = SITE_CONFIG.loadingMessages;
      const message = document.getElementById('loadingMessage');
      const screen = document.getElementById('loadingScreen');
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
      window.addEventListener('load', () => {
        window.setTimeout(() => screen.classList.add('is-done'), 850);
      }, { once: true });
      window.setTimeout(() => screen.classList.add('is-done'), 2200);
    })();

    // Switch between the arrow cursor and hand cursor without changing size.
    (() => {
      const cursor = document.querySelector('.custom-cursor');
      const finePointer = window.matchMedia('(pointer: fine)').matches;
      if (!cursor || !finePointer) return;
      document.body.classList.add('custom-cursor-active');
      const interactiveSelector = 'a, button, [role="button"], input, select, summary, label, [onclick], .tile-link';
      window.addEventListener('pointermove', event => {
        cursor.style.left = event.clientX + 'px';
        cursor.style.top = event.clientY + 'px';
        cursor.classList.add('is-visible');
        cursor.classList.toggle('is-hovering', !!event.target.closest(interactiveSelector));
      }, { passive: true });
      window.addEventListener('pointerleave', () => cursor.classList.remove('is-visible'));
      window.addEventListener('pointerenter', () => cursor.classList.add('is-visible'));
      document.addEventListener('pointerover', event => {
        cursor.classList.toggle('is-hovering', !!event.target.closest(interactiveSelector));
      }, { passive: true });
    })();

    // PWA install prompt: show our own install notification when the browser permits it.
    (() => {
      const banner = document.getElementById('installBanner');
      const message = document.getElementById('installMessage');
      message.textContent = SITE_CONFIG.installMessage;
      document.getElementById('installButton').textContent = SITE_CONFIG.installButtonText;
      document.getElementById('installDismiss').textContent = SITE_CONFIG.installDismissText;
      const installButton = document.getElementById('installButton');
      const dismissButton = document.getElementById('installDismiss');
      let installPrompt = null;
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) return;

      const showBanner = (text, showInstall = true) => {
        message.textContent = text;
        installButton.style.display = showInstall ? '' : 'none';
        banner.classList.add('is-visible');
      };
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        installPrompt = event;
        showBanner('Install Aaron Carter’s Arcade for quick access!', true);
      });
      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        banner.classList.remove('is-visible');
      });
      installButton.addEventListener('click', async () => {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          installPrompt = null;
          banner.classList.remove('is-visible');
        } else {
          showBanner('To install: open your browser menu and choose “Install app” or “Add to Home screen”.', false);
        }
      });
      dismissButton.addEventListener('click', () => banner.classList.remove('is-visible'));
      // Some browsers don't expose beforeinstallprompt (notably iOS Safari); provide helpful instructions.
      window.setTimeout(() => {
        if (!installPrompt && !banner.classList.contains('is-visible')) {
          showBanner('Add AC Arcade to your device for quick access.', true);
        }
      }, 1800);
    })();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(error => console.warn('Service worker registration failed:', error));
      });
    }
  </script>
