
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        #message {
            display: none;
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: black;
        }
    </style>
</head>
<body>

<div id="message">
    bro allow pop-ups and refresh or go back to here gng-a-lang
</div>

<script>
    const link = "https://forms.gle/rnEDTZDkT14nzWsdA";

    const newTab = window.open(link, "_blank");

    if (newTab) {
        window.close();
    }

    setTimeout(() => {
        if (!newTab || !newTab.closed) {
            document.getElementById("message").style.display = "block";
        }
    }, 2000);
</script>

</body>
</html>
