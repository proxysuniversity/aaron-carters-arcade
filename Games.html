<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: white;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 20px 24px 12px;
  text-align: center;
}

.logo {
  display: inline-block;
  width: 340px;
  max-width: 90%;
  height: auto;
  animation: floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.search-area {
  padding: 8px 20px 20px;
  text-align: center;
}

#search {
  width: 100%;
  max-width: 600px;
  padding: 13px 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
  background: white;
  color: #111;
  outline: none;
}

#search:focus { border-color: #777; }

#gameSection { padding: 0 20px 24px; }

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title h2 {
  margin: 0;
  font-size: 21px;
}

#gameCount {
  color: #777;
  font-size: 13px;
}

#gameList {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  padding: 5px 0 14px;
  scrollbar-width: thin;
  scrollbar-color: #bbb white;
}

.game-item {
  flex: 0 0 145px;
  width: 145px;
  color: #111;
  text-decoration: none;
  cursor: pointer;
  outline-offset: 3px;
}

.game-item img {
  display: block;
  width: 145px;
  height: 95px;
  object-fit: cover;
  background: #eee;
  border-radius: 3px;
}

.game-item:hover .game-name { text-decoration: underline; }

.game-name {
  display: block;
  margin-top: 7px;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.35;
}

.game-description {
  margin-top: 4px;
  color: #666;
  font-size: 11px;
  line-height: 1.4;
}

#noResults {
  display: none;
  padding: 20px 0;
  color: #666;
}

#playerSection {
  display: none;
  padding: 0 20px 24px;
}

.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

#playingTitle {
  margin: 0;
  font-size: 20px;
  overflow-wrap: anywhere;
}

.player-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.player-buttons button {
  padding: 9px 13px;
  background: white;
  color: #111;
  border: 1px solid #bbb;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}

.player-buttons button:hover { background: #eee; }

#gameFrame {
  display: block;
  width: 100%;
  height: 70vh;
  min-height: 350px;
  border: 1px solid #ccc;
  background: white;
}

#gameFile {
  display: none;
  width: 100%;
  height: 70vh;
  min-height: 350px;
  border: 1px solid #ccc;
}

#gameFileFrame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#playerMessage {
  display: none;
  padding: 20px;
  border: 1px solid #ddd;
  color: #444;
  line-height: 1.6;
}

#playerMessage a { color: #111; }

footer {
  padding: 18px;
  border-top: 1px solid #eee;
  color: #777;
  text-align: center;
  font-size: 12px;
}

@media (max-width: 600px) {
  header { padding-top: 22px; }

  .logo { width: 280px; }

  .game-item {
    flex-basis: 125px;
    width: 125px;
  }

  .game-item img {
    width: 125px;
    height: 85px;
  }

  #gameFrame,
  #gameFile {
    height: 65vh;
    min-height: 300px;
  }

  #playerSection,
  #gameSection {
    padding-left: 12px;
    padding-right: 12px;
  }
}
</style>

<section id="gameSection">

  { name: "Friday Night Funkin' VS Matt (Wii Funkin')", image: "https://i.ytimg.com/vi/-PwWVpfLZ6A/maxresdefault.jpg", link: "https://xlegends.github.io/moosyu.github.io/fnf/matt/index.html", file: "", description: "", hide: false }
];

const gameList = document.getElementById("gameList");
const search = document.getElementById("search");
const gameCount = document.getElementById("gameCount");
const noResults = document.getElementById("noResults");
const sectionTitle = document.getElementById("sectionTitle");

const playerSection = document.getElementById("playerSection");
const playingTitle = document.getElementById("playingTitle");
const gameFrame = document.getElementById("gameFrame");
const gameFile = document.getElementById("gameFile");
const gameFileFrame = document.getElementById("gameFileFrame");
const playerMessage = document.getElementById("playerMessage");

let currentGame = null;

function renderGames() {
  const query = search.value.trim().toLowerCase();

  const visibleGames = games.filter(game => {
    if (game.hide === true) return false;

    return game.name.toLowerCase().includes(query) ||
      (game.description || "").toLowerCase().includes(query);
  });

  gameList.replaceChildren();

  visibleGames.forEach(game => {
    // Use a DIV instead of an A tag so the browser doesn't preview URLs.
    const item = document.createElement("div");
    item.className = "game-item";
    item.tabIndex = 0;
    item.setAttribute("role", "button");
    item.setAttribute("aria-label", "Play " + game.name);

    item.addEventListener("click", () => openGame(game));

    item.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openGame(game);
      }
    });

    const thumbnail = document.createElement("img");
    thumbnail.src = game.image;
    thumbnail.alt = game.name;
    thumbnail.loading = "lazy";

    const name = document.createElement("span");
    name.className = "game-name";
    name.textContent = game.name;

    item.appendChild(thumbnail);
    item.appendChild(name);

    if (game.description) {
      const description = document.createElement("div");
      description.className = "game-description";
      description.textContent = game.description;
      item.appendChild(description);
    }

    gameList.appendChild(item);
  });

  gameCount.textContent = visibleGames.length + " games";
  noResults.style.display = visibleGames.length ? "none" : "block";
  sectionTitle.textContent = query ? "Search Results" : "Games";
}

function openGame(game) {
  currentGame = game;

  playingTitle.textContent = game.name;
  playerSection.style.display = "block";
  playerMessage.style.display = "none";
  gameFrame.style.display = "block";
  gameFile.style.display = "none";

  gameFrame.src = "about:blank";
  gameFileFrame.src = "about:blank";

  if (game.file) {
    gameFrame.style.display = "none";
    gameFile.style.display = "block";
    gameFileFrame.src = game.file;
  } else {
    gameFrame.src = game.link;
  }

  playerSection.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

document.getElementById("closeGame").addEventListener("click", () => {
  playerSection.style.display = "none";
  gameFrame.src = "about:blank";
  gameFileFrame.src = "about:blank";
  currentGame = null;
});

document.getElementById("fullscreen").addEventListener("click", async () => {
  const activeFrame = gameFile.style.display === "block"
    ? gameFile
    : gameFrame;

  try {
    if (activeFrame.requestFullscreen) {
      await activeFrame.requestFullscreen();
    }
  } catch (error) {
    console.warn("Fullscreen could not be opened.", error);
  }
});

search.addEventListener("input", renderGames);

renderGames();
</script>
